name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Guildmoji. **Never paste a Discord token,
        user ID, or private server content here.** Redact it from screenshots,
        logs, and config snippets first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report does not contain a token or other secret.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Guildmoji with ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: discord-client
    attributes:
      label: Discord client
      options:
        - Discord desktop app
        - Vesktop / Vencord / Equicord
        - Discord web (browser)
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Arch Linux, GNOME 49, Wayland
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output and browser console errors, with secrets removed.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, number of servers, whether ffmpeg is installed, anything else useful.
